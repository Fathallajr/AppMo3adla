<!-- Fast, compact loading state -->
<div *ngIf="showLoading" class="loading-overlay" role="status" aria-live="polite">
  <div class="loading-spinner" aria-hidden="true"></div>
</div>

<app-navbar></app-navbar>
<main class="app-page-shell min-h-dvh relative overflow-hidden" [class.route-home]="currentRoute === '/' || currentRoute === ''">
	<div [@pageTransition]="getRouteAnimationState()">
		<router-outlet />
	</div>
</main>
<app-footer></app-footer>

<!-- Subscription pill button (hidden on all subscription pages) -->
<a *ngIf="!currentRoute.startsWith('/subscription')"
   routerLink="/subscription-ab-reviews"
   class="subscription-float-button">
  <span>اشترك الآن</span>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M20 12H4" />
  </svg>
</a>

<!-- WhatsApp pill button (hidden on subscription details page) -->
<a *ngIf="currentRoute !== '/subscription-details'"
   href="https://api.whatsapp.com/send?phone=201554843745"
   target="_blank"
